name: ci

# Pull Request / main への push を検証する CI。
# build-and-deploy.yml とは責務を分離: こちらはビルド・静的解析・テストの
# 検証のみを行い、イメージの push やインフラリポジトリへの反映は行わない。

# main への push 時の自動実行は運用停止 (2026-10-01) に伴い止めている。
# pull_request はブランチ保護の必須チェック (lint-and-test / docker-build) のため残す。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -coverprofile=coverage.out

      - name: Run octocov
        uses: k1LoW/octocov-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
